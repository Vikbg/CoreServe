name: Regenerate lockfile

on:
  push:
    branches:
      - fix/remove-unused-artillery-20260810
    paths:
      - .github/workflows/regenerate-lockfile.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: write

jobs:
  regenerate:
    if: "${{ github.event.head_commit.message != 'chore: remove unused artillery' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: remove unused artillery"
          git push
